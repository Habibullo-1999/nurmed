          format: double
          minimum: 0.001
        costPrice:
          type: number
          format: double
          default: 0

    CreateTransferOrderRequest:
      type: object
      required: [fromWarehouseId, toWarehouseId, items]
      properties:
        companyId:
          type: integer
          format: int64
        fromWarehouseId:
          type: integer
          format: int64
          description: Source warehouse ID
        toWarehouseId:
          type: integer
          format: int64
          description: Destination warehouse ID (must differ from fromWarehouseId)
        documentNo:
          type: string
          description: Document number; auto-generated if omitted
        note:
          type: string
        transferredAt:
          type: string
          format: date-time
          description: Transfer date; defaults to now
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransferItemRequest'

    TransferOrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: number
          format: double
        costPrice:
          type: number
          format: double

    TransferOrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyID:
          type: integer
          format: int64
        documentNo:
          type: string
        fromWarehouseId:
          type: integer
          format: int64
        fromWarehouseName:
          type: string
        toWarehouseId:
          type: integer
          format: int64
        toWarehouseName:
          type: string
        status:
          type: string
          enum: [draft, posted, cancelled]
        note:
          type: string
        transferredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransferOrderItemResponse'


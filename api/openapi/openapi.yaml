  /warehouse/stock:
    get:
      tags: [Warehouse]
      summary: Get product stock remainders
      operationId: getWarehouseStock
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCompanyID'
        - in: query
          name: company_id
          required: false
          schema:
            type: integer
            format: int64
        - in: query
          name: warehouse_id
          required: false
          schema:
            type: integer
            format: int64
          description: Filter by specific warehouse
        - in: query
          name: search
          required: false
          schema:
            type: string
          description: Search by product name (partial), exact barcode, or exact SKU
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Stock list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      payload:

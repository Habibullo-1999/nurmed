components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'

  parameters:
    XCompanyID:
      in: header
      name: X-Company-ID
      required: false
      schema:
        type: integer
        format: int64
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 200
    Offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0

  schemas:
    Response:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: Успешно выполнено
        payload:
          nullable: true

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          example: owner
        password:
          type: string
          example: StrongPass123!

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string

    CheckDeviceRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: Username, email or phone number

    CheckDeviceResponse:
      type: object
      properties:
        deviceId:
          type: string
          description: Unique device identifier
        requiresVerification:
          type: boolean
          description: Whether verification code is required
        message:
          type: string
          description: Response message
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'

    DeviceInfo:
      type: object
      properties:
        deviceId:
          type: string
          description: Unique device identifier
        deviceName:
          type: string
          description: Device name
        deviceType:
          type: string
          description: Device type (mobile, web, desktop)
        osType:
          type: string
          description: Operating system (iOS, Android, Windows, macOS, Linux)
        osVersion:
          type: string
          description: Operating system version
        appVersion:
          type: string
          description: Application version
        lastUsedAt:
          type: string
          format: date-time
          description: Last used timestamp
        isVerified:
          type: boolean
          description: Whether device is verified
        createdAt:
          type: string
          format: date-time
          description: Device creation timestamp

    VerifyDeviceRequest:
      type: object
      required: [identifier, verificationCode]
      properties:
        identifier:
          type: string
        verificationCode:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        tokenType:
          type: string
          example: Bearer
        userId:
          type: integer
          format: int64
        userName:
          type: string

    UserRoleAssignment:
      type: object
      required: [roleCode]
      properties:
        roleCode:
          type: string
          example: owner
        scopeType:
          type: string
          enum: [global, company, branch, warehouse]
          example: company
        scopeId:
          type: integer
          format: int64
        ownOnly:
          type: boolean

    CreateUserRequest:
      type: object
      required: [userName, password, firstName, role]
      properties:
        companyId:
          type: integer
          format: int64
        userName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [active, blocked, invited, deleted]
          example: active
        isSuperAdmin:
          type: boolean
        role:
          $ref: '#/components/schemas/UserRoleAssignment'

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyID:
          type: integer
          format: int64
        userName:
          type: string
        phone:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProductRequest:
      type: object
      required: [name]
      properties:
        companyId:
          type: integer
          format: int64
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
        unit:
          type: string
          example: pcs
        purchasePrice:
          type: number
          format: double
        salePrice:
          type: number
          format: double
        status:
          type: string
          enum: [active, inactive]
          example: active

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyID:
          type: integer
          format: int64
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
        unit:
          type: string
        purchasePrice:
          type: number
          format: double
        salePrice:
          type: number
          format: double
        status:
          type: string
          enum: [active, inactive]
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SalesOrderItemRequest:
      type: object
      required: [productName, quantity, price]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double

    SalesCreateOrderRequest:
      type: object
      required: [items]
      properties:
        companyId:
          type: integer
          format: int64
        documentNo:
          type: string
        customerName:
          type: string
        currency:
          type: string
          example: UZS
        status:
          type: string
          enum: [draft, posted, cancelled]
          example: posted
        soldAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderItemRequest'

    SalesOrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        amount:
          type: number
          format: double

    SalesOrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyID:
          type: integer
          format: int64
        channel:
          type: string
          enum: [realization, mobile, pos]
        documentNo:
          type: string
        customerName:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [draft, posted, cancelled]
        totalAmount:
          type: number
          format: double
        itemCount:
          type: integer
        soldAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderItemResponse'

    SalesCreateReturnRequest:
      type: object
      required: [orderId, totalAmount]
      properties:
        orderId:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
          enum: [draft, posted, cancelled]
        totalAmount:
          type: number
          format: double
        returnedAt:
          type: string
          format: date-time

    SalesReturnResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        companyID:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
          enum: [draft, posted, cancelled]
        totalAmount:
          type: number
          format: double
        returnedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PurchaseOrderItemRequest:
      type: object
      required: [productName, quantity, price]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double

    PurchaseCreateOrderRequest:
      type: object
      required: [items]
      properties:
        companyId:
          type: integer
          format: int64
        documentNo:
          type: string
        supplierName:
          type: string
        currency:
          type: string
          example: UZS
        status:
          type: string
          enum: [draft, posted, cancelled]
          example: posted
        purchasedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItemRequest'

    PurchaseOrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        amount:
          type: number
          format: double

    PurchaseOrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyID:
          type: integer
          format: int64
        documentNo:
          type: string
        supplierName:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [draft, posted, cancelled]
        totalAmount:
          type: number
          format: double
        itemCount:
          type: integer
        purchasedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItemResponse'

    PurchaseCreateReturnRequest:
      type: object
      required: [orderId, totalAmount]
      properties:
        orderId:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
          enum: [draft, posted, cancelled]
        totalAmount:
          type: number
          format: double
        returnedAt:
          type: string
          format: date-time

    PurchaseReturnResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        companyID:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
          enum: [draft, posted, cancelled]
        totalAmount:
          type: number
          format: double
        returnedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Warehouse schemas ──────────────────────────────────────────────────────

    WarehouseResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyID:
          type: integer
          format: int64
        name:
          type: string
          example: Основной склад
        address:
          type: string
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WarehouseStockResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        warehouseId:
          type: integer
          format: int64
        warehouseName:
          type: string
          example: Основной склад
        productId:
          type: integer
          format: int64
        productName:
          type: string
        sku:
          type: string
        barcode:
          type: string
        unit:
          type: string
          example: шт
        quantity:
          type: number
          format: double
          example: 10.5
        costPrice:
          type: number
          format: double
          description: Unit cost price (purchase price)
          example: 21.00
        totalCostPrice:
          type: number
          format: double
          description: quantity × costPrice
          example: 220.50

    # ── Inventory schemas ──────────────────────────────────────────────────────

    InventoryItemRequest:
      type: object
      required: [productName]
      properties:
        productId:
          type: integer
          format: int64
          description: Link to existing product (optional)
        productName:
          type: string
        expectedQty:
          type: number
          format: double
          description: Quantity expected according to the system (pre-filled from stock)
          default: 0
        actualQty:
          type: number
          format: double
          description: Quantity actually counted during inventory
          default: 0
        costPrice:
          type: number
          format: double
          description: Unit cost price used for surplus/deficit calculation
          default: 0

    CreateInventoryOrderRequest:
      type: object
